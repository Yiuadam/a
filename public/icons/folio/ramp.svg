<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Folio — implied ramp</title>
  <!--
    Can the scale be implied rather than stated?

    The top edge is one continuous diagonal with three shallow notches cut into
    it — 40 units of riser on a slope that climbs 440. Also the one inverted
    palette in the family: clay page on a cream ground, which puts the paper in
    the ground rather than in the mark.

    Kept because the answer it gives is worth having, not because it wins.
  -->
  <defs>
    <linearGradient id="fr-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="1" stop-color="#eddfcd" />
    </linearGradient>
    <linearGradient id="fr-page" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#7c4222" />
      <stop offset="0.55" stop-color="#b0632f" />
      <stop offset="1" stop-color="#d9955c" />
    </linearGradient>
    <linearGradient id="fr-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c880" />
      <stop offset="1" stop-color="#e2a75e" />
    </linearGradient>
    <mask id="fr-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="296" y="694" width="430" height="30" rx="15" fill="#000" />
      <rect x="296" y="772" width="322" height="30" rx="15" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#fr-ground)" />

  <rect
    x="268"
    y="296"
    width="500"
    height="548"
    rx="26"
    fill="url(#fr-back)"
    transform="rotate(-9 512 560)"
  />

  <g transform="rotate(3 512 560)">
    <path
      d="M 250 862 L 250 690 L 386 584 L 386 544 L 522 438 L 522 398
         L 658 292 L 658 252 L 796 252 L 796 862 Z"
      transform="translate(22 26)"
      fill="#8b4a26"
      opacity="0.26"
    />
    <path
      d="M 250 862 L 250 690 L 386 584 L 386 544 L 522 438 L 522 398
         L 658 292 L 658 252 L 796 252 L 796 862 Z"
      fill="url(#fr-page)"
      mask="url(#fr-ruled)"
    />
  </g>
</svg>
