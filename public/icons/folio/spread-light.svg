<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Folio — spread, gutter of light</title>
  <!--
    The gutter given something to do.

    Between the two leaves is not a gap but a wedge of light: honey at the head
    where it is 114 wide, fading as it narrows to 36 at the foot. The book reads
    as opening, and the brightest thing in the square sits at the top of the
    climb rather than at the bottom.

    Three steps on the near leaf — with two leaves competing for the square,
    five became noise.
  -->
  <defs>
    <radialGradient id="fsl-ground" cx="0.5" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#3a2c1e" />
      <stop offset="1" stop-color="#14100d" />
    </radialGradient>
    <linearGradient id="fsl-wedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9bd" />
      <stop offset="0.45" stop-color="#e5b25c" />
      <stop offset="1" stop-color="#a95d2f" />
    </linearGradient>
    <linearGradient id="fsl-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a95d2f" />
      <stop offset="1" stop-color="#6f3a1e" />
    </linearGradient>
    <linearGradient id="fsl-right" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d3b8" />
      <stop offset="0.6" stop-color="#f8f0e4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
    <mask id="fsl-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="238" y="470" width="176" height="24" rx="12" fill="#000" />
      <rect x="230" y="546" width="206" height="24" rx="12" fill="#000" />
      <rect x="224" y="622" width="156" height="24" rx="12" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#fsl-ground)" />

  <!-- The light itself, laid down first so both leaves sit on top of it. -->
  <path d="M 450 214 L 564 214 L 528 858 L 492 858 Z" fill="url(#fsl-wedge)" />

  <path
    d="M 450 244 C 364 202 266 216 186 284 L 186 784 C 266 850 382 864 492 848 Z"
    fill="url(#fsl-left)"
    mask="url(#fsl-ruled)"
  />

  <path
    d="M 564 330 L 660 330 L 660 246 L 754 246 L 754 158 L 842 158
       L 842 784 C 754 850 640 864 528 848 Z"
    transform="translate(-24 16)"
    fill="#0b0907"
    opacity="0.5"
  />

  <path
    d="M 564 330 L 660 330 L 660 246 L 754 246 L 754 158 L 842 158
       L 842 784 C 754 850 640 864 528 848 Z"
    fill="url(#fsl-right)"
  />
</svg>
