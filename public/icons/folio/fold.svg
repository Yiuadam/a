<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Folio — folded corner</title>
  <!--
    A page turning rather than a page sitting.

    The foot of the sheet is folded back on the diagonal, showing its underside
    in a darker clay, so the paper has two faces and the mark has a fold line
    running through it. The rising edge says scale; the turned corner says this
    is something you are partway through.
  -->
  <defs>
    <radialGradient id="ffd-ground" cx="0.32" cy="0.72" r="0.95">
      <stop offset="0" stop-color="#31261d" />
      <stop offset="1" stop-color="#15110e" />
    </radialGradient>
    <linearGradient id="ffd-face" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#e6d3b8" />
      <stop offset="0.55" stop-color="#f8f0e4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
    <linearGradient id="ffd-under" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a54" />
      <stop offset="1" stop-color="#8b4a26" />
    </linearGradient>
    <mask id="ffd-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="304" y="654" width="380" height="26" rx="13" fill="#000" />
      <rect x="304" y="722" width="256" height="26" rx="13" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#ffd-ground)" />

  <g transform="rotate(3 512 560)">
    <path
      d="M 254 862 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 682 L 614 862 Z"
      transform="translate(22 26)"
      fill="#0d0a08"
      opacity="0.45"
    />
    <path
      d="M 254 862 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 682 L 614 862 Z"
      fill="url(#ffd-face)"
      mask="url(#ffd-ruled)"
    />
    <!-- The underside of the turned corner. -->
    <path d="M 794 682 L 614 862 L 794 862 Z" fill="url(#ffd-under)" />
  </g>
</svg>
