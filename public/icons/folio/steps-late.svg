<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Folio — three steps, late transition</title>
  <!--
    Where the page becomes the scale, rather than how many steps it takes.

    The sheet runs flat for the first 0.618 of its width and only then climbs,
    in three big risers. Holding the page still for that long is what makes the
    climb read as an event — the five-step version is stepping from the moment
    it starts, so nothing in it is a departure from anything.
  -->
  <defs>
    <radialGradient id="fl-ground" cx="0.3" cy="0.75" r="0.95">
      <stop offset="0" stop-color="#31261d" />
      <stop offset="1" stop-color="#15110e" />
    </radialGradient>
    <linearGradient id="fl-front" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#e6d3b8" />
      <stop offset="0.55" stop-color="#f8f0e4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
    <linearGradient id="fl-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0632f" />
      <stop offset="1" stop-color="#7c4222" />
    </linearGradient>
    <mask id="fl-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="300" y="716" width="414" height="28" rx="14" fill="#000" />
      <rect x="300" y="792" width="292" height="28" rx="14" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#fl-ground)" />

  <rect
    x="272"
    y="300"
    width="500"
    height="546"
    rx="26"
    fill="url(#fl-back)"
    transform="rotate(-12 512 560)"
  />

  <g transform="rotate(4 512 560)">
    <path
      d="M 250 866 L 250 660 L 556 660 L 556 530 L 638 530 L 638 400
         L 720 400 L 720 270 L 800 270 L 800 866 Z"
      transform="translate(20 24)"
      fill="#0d0a08"
      opacity="0.45"
    />
    <path
      d="M 250 866 L 250 660 L 556 660 L 556 530 L 638 530 L 638 400
         L 720 400 L 720 270 L 800 270 L 800 866 Z"
      fill="url(#fl-front)"
      mask="url(#fl-ruled)"
    />
  </g>
</svg>
