<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Nine</title>
  <!--
    Direction 5: the top of the scale, as the whole mark. Band 9 is the thing
    every learner in this app is aiming at, and a single numeral is the largest
    shape any of these five directions can put on a home screen.

    Drawn as two strokes of one weight — a ring and a tail — rather than as a
    typeset glyph, so it stays a mark and not a character.
  -->
  <defs>
    <linearGradient id="nine-ground" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#b3652f" />
      <stop offset="1" stop-color="#7c4222" />
    </linearGradient>
    <linearGradient id="nine-stroke" x1="0.2" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#f2ddb4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#nine-ground)" />

  <g
    transform="translate(-8 -14)"
    fill="none"
    stroke="url(#nine-stroke)"
    stroke-width="104"
    stroke-linecap="round"
  >
    <circle cx="500" cy="380" r="152" />
    <path d="M 700 400 C 702 646 658 782 470 828" />
  </g>
</svg>
