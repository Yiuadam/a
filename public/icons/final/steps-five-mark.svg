<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 99 950 950" width="950" height="950">
  <title>BandUp</title>
  <!--
    The BandUp mark, for the site header and the browser tab.

    Same drawing as steps-five-flat.svg — the App Store master — with nothing
    redrawn. Two things differ, and both exist to stop the sheet colliding with
    the rounded corner.

    The viewBox is centred on the artwork rather than on the canvas. The marks
    sit 62px below the middle of the 1024 square, so a crop centred on the
    canvas pushes them down and to the right until the paper runs off the
    corner. Measuring the real bounds — x 220-835, y 237-910 once both
    rotations are applied — and centring on 527,574 instead gives 168px of
    ground either side and 138px above and below. Even margins, and nothing
    touching an edge.

    The ground is then bigger than the master's, because a centred 950 box
    reaches y=1049 and the original rect stopped at 1024: the last 25px would
    have been transparent. It now runs -200 to 1224 in both directions, and the
    gradient is pinned to user space so growing the rect does not stretch it.

    Do not redraw either file to match the other. If the design changes, change
    the master and re-derive this.
  -->
  <defs>
    <radialGradient id="f5-ground" gradientUnits="userSpaceOnUse" cx="307.2" cy="768" r="972.8">
      <stop offset="0" stop-color="#31261d" />
      <stop offset="1" stop-color="#15110e" />
    </radialGradient>
    <linearGradient id="f5-front" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#e6d3b8" />
      <stop offset="0.55" stop-color="#f8f0e4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
    <linearGradient id="f5-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0632f" />
      <stop offset="1" stop-color="#7c4222" />
    </linearGradient>
    <mask id="f5-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="304" y="690" width="404" height="26" rx="13" fill="#000" />
      <rect x="304" y="762" width="286" height="26" rx="13" fill="#000" />
    </mask>
  </defs>

  <rect x="-200" y="-200" width="1424" height="1424" fill="url(#f5-ground)" />

  <rect
    x="272"
    y="300"
    width="500"
    height="546"
    rx="26"
    fill="url(#f5-back)"
    transform="rotate(-13 512 560)"
  />

  <g transform="rotate(4 512 560)">
    <path
      d="M 254 866 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 866 Z"
      transform="translate(20 24)"
      fill="#0d0a08"
      opacity="0.45"
    />
    <path
      d="M 254 866 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 866 Z"
      fill="url(#f5-front)"
      mask="url(#f5-ruled)"
    />
  </g>
</svg>
