<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 190 730 730" width="730" height="730">
  <title>BandUp</title>
  <!--
    The BandUp mark, for the site header and the browser tab.

    This is steps-five-flat.svg — the chosen app icon — with nothing redrawn.
    The only change is the viewBox: the master is a full-bleed 1024 canvas with
    the mark sitting well inside it, which is right for a home screen where the
    icon is 60px or larger and stands alone. In a 36px header badge that
    padding costs the mark about a third of its width, and at that size the
    five steps stop reading as steps.

    Cropping to 150 190 730 730 keeps the dark ground as a frame and gives the
    staircase the pixels it needs. Rendered and compared at 32, 36, 64 and
    128px before choosing this crop over three tighter ones, which each ate so
    much of the ground that the mark stopped looking like an icon and started
    looking like a photograph of one.

    Do not redraw either file to match the other. The master is what Icon
    Composer consumes for the App Store; this is the same art framed for a
    different size. If the design changes, change the master and re-crop.
  -->
  <defs>
    <radialGradient id="f5-ground" cx="0.3" cy="0.75" r="0.95">
      <stop offset="0" stop-color="#31261d" />
      <stop offset="1" stop-color="#15110e" />
    </radialGradient>
    <linearGradient id="f5-front" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#e6d3b8" />
      <stop offset="0.55" stop-color="#f8f0e4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
    <linearGradient id="f5-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0632f" />
      <stop offset="1" stop-color="#7c4222" />
    </linearGradient>
    <mask id="f5-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="304" y="690" width="404" height="26" rx="13" fill="#000" />
      <rect x="304" y="762" width="286" height="26" rx="13" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#f5-ground)" />

  <rect
    x="272"
    y="300"
    width="500"
    height="546"
    rx="26"
    fill="url(#f5-back)"
    transform="rotate(-13 512 560)"
  />

  <g transform="rotate(4 512 560)">
    <path
      d="M 254 866 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 866 Z"
      transform="translate(20 24)"
      fill="#0d0a08"
      opacity="0.45"
    />
    <path
      d="M 254 866 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 866 Z"
      fill="url(#f5-front)"
      mask="url(#f5-ruled)"
    />
  </g>
</svg>
