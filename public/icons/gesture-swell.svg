<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Gesture, swelling stroke</title>
  <!--
    Gesture variation: the writing idea moves into the line itself.

    The baseline needs a separate nib corner to say "writing". Here the stroke
    carries it — thick on one diagonal, thin on the other, the way a broad nib
    held at a fixed angle behaves. There is no nib shape left to draw.

    How it is made, and how it is *not*: the obvious construction — stroke the
    loop wide, then subtract the same loop stroked narrow and shifted — cannot
    work. Subtracting one ribbon from another always leaves a ribbon on each
    side of the hole, so the mark comes out as two concentric outlines rather
    than one modulated one. What works is areas, not strokes: fill the loop
    solid, then knock out a scaled-down copy of it shifted off-centre. Where the
    counter sits close to the edge the ribbon is thin, where it sits far the
    ribbon is fat, and the whole modulation follows from one scale and one
    offset.
  -->
  <defs>
    <radialGradient id="swl-ground" cx="0.3" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#302519" />
      <stop offset="1" stop-color="#14100d" />
    </radialGradient>
    <linearGradient id="swl-line" x1="0.05" y1="0.15" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="0.42" stop-color="#f2ddb4" />
      <stop offset="0.75" stop-color="#d9955c" />
      <stop offset="1" stop-color="#a95d2f" />
    </linearGradient>

    <mask id="swl-counter">
      <rect width="1024" height="1024" fill="#fff" />
      <path
        d="M 226 456 C 244 344 322 296 400 336 C 470 372 520 340 612 302
           L 874 560 L 688 904 L 410 772 A 262 262 0 0 1 226 456 Z"
        transform="translate(30 -34) translate(550 600) scale(0.7) translate(-550 -600)"
        fill="#000"
      />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#swl-ground)" />

  <g transform="rotate(-4 512 512)">
    <path
      d="M 226 456 C 244 344 322 296 400 336 C 470 372 520 340 612 302
         L 874 560 L 688 904 L 410 772 A 262 262 0 0 1 226 456 Z"
      transform="translate(26 30)"
      fill="#0b0907"
      opacity="0.45"
    />
    <path
      d="M 226 456 C 244 344 322 296 400 336 C 470 372 520 340 612 302
         L 874 560 L 688 904 L 410 772 A 262 262 0 0 1 226 456 Z"
      fill="url(#swl-line)"
      mask="url(#swl-counter)"
    />
  </g>
</svg>
