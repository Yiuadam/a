<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Folio</title>
  <!--
    Reading × the band scale.

    One sheet of paper, whose top edge does not run straight: it climbs to the
    right in five steps. Read it as a page and the steps are a torn edge; read
    it as the scale and the page is a bar chart. The two readings use the same
    outline, which is the whole point.

    Depth comes from a second sheet behind, turned the other way — the overlap
    and the cast shadow are what stop this being a flat rectangle.
  -->
  <defs>
    <radialGradient id="fol-ground" cx="0.3" cy="0.75" r="0.95">
      <stop offset="0" stop-color="#31261d" />
      <stop offset="1" stop-color="#15110e" />
    </radialGradient>
    <linearGradient id="fol-front" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#e6d3b8" />
      <stop offset="0.55" stop-color="#f8f0e4" />
      <stop offset="1" stop-color="#fdfaf6" />
    </linearGradient>
    <linearGradient id="fol-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0632f" />
      <stop offset="1" stop-color="#7c4222" />
    </linearGradient>

    <!-- The ruled lines are knocked out of the sheet, not painted on top of it. -->
    <mask id="fol-ruled">
      <rect width="1024" height="1024" fill="#fff" />
      <rect x="304" y="690" width="404" height="26" rx="13" fill="#000" />
      <rect x="304" y="762" width="286" height="26" rx="13" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#fol-ground)" />

  <rect
    x="272"
    y="300"
    width="500"
    height="546"
    rx="26"
    fill="url(#fol-back)"
    transform="rotate(-13 512 560)"
  />

  <g transform="rotate(4 512 560)">
    <path
      d="M 254 866 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 866 Z"
      transform="translate(20 24)"
      fill="#0d0a08"
      opacity="0.45"
    />
    <path
      d="M 254 866 L 254 700 L 370 700 L 370 604 L 486 604 L 486 496
         L 602 496 L 602 384 L 718 384 L 718 254 L 794 254 L 794 866 Z"
      fill="url(#fol-front)"
      mask="url(#fol-ruled)"
    />
  </g>
</svg>
