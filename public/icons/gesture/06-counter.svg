<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Gesture 06, Counter</title>
  <!--
    Everything interesting happens in the hole.

    The stroke has been fattened until it stops being a line and becomes a
    field, and what it closes around is an ascending wedge — the band scale, cut
    as a void rather than drawn as a picture. The outer edge still carries the
    four behaviours, but quietly:

      a sawtooth along the upper left — listening
      a dead-flat floor              — reading
      one spike out to the right     — writing
      a wide round shoulder          — speaking

    It is the highest-contrast mark in the family, because at small sizes a hole
    survives when a line does not. The risk it runs is the opposite one: read
    too fast, it is a wedge in a blob, and the gesture is gone.
  -->
  <defs>
    <radialGradient id="counter-ground" cx="0.28" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#34271a" />
      <stop offset="1" stop-color="#141009" />
    </radialGradient>
    <linearGradient id="counter-body" gradientUnits="userSpaceOnUse"
      x1="140" y1="220" x2="900" y2="820">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="0.45" stop-color="#f2ddb4" />
      <stop offset="0.8" stop-color="#dfa87f" />
      <stop offset="1" stop-color="#c1743f" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#counter-ground)" />

  <path
    d="M 146 556
       C 146 396 264 262 438 254
       C 518 250 538 318 602 314
       C 666 310 674 244 748 264
       C 852 292 918 386 918 498
       L 986 560
       L 898 618
       C 866 720 736 794 574 794
       L 176 794
       C 156 722 146 640 146 556 Z
       M 296 700
       L 706 396
       L 706 700 Z"
    fill-rule="evenodd"
    fill="#0b0906"
    opacity="0.45"
    transform="translate(26 30)"
  />
  <path
    d="M 146 556
       C 146 396 264 262 438 254
       C 518 250 538 318 602 314
       C 666 310 674 244 748 264
       C 852 292 918 386 918 498
       L 986 560
       L 898 618
       C 866 720 736 794 574 794
       L 176 794
       C 156 722 146 640 146 556 Z
       M 296 700
       L 706 396
       L 706 700 Z"
    fill-rule="evenodd"
    fill="url(#counter-body)"
  />
</svg>
