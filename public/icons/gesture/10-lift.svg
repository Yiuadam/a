<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Gesture 10, Lift</title>
  <!--
    The bluntest fusion in the set, and the one built to survive being tiny.

    A closed bubble with a rippled crown, and hanging off its lower left a
    single long spike doing two jobs at once: it is the ruled line of reading,
    and it is the nib of writing, because a ruled line drawn with a nib ends in
    exactly this shape. Two of the four behaviours share one form instead of
    taking a quadrant each.

    That halving is the point. The parent gave all four an equal share of the
    circumference and none of them got enough room. Here listening and speaking
    own the bubble, reading and writing own the tail, and both halves are big
    enough to read at any size.

    The bubble is a wide oval and the tail falls to the left. Circular with the
    tail to the right — which is how this was first drawn — is a magnifying
    glass, and nothing rescues it once the eye has decided that.
  -->
  <defs>
    <radialGradient id="lift-ground" cx="0.3" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="1" stop-color="#e6d5bd" />
    </radialGradient>
    <linearGradient id="lift-line" gradientUnits="userSpaceOnUse"
      x1="880" y1="180" x2="180" y2="900">
      <stop offset="0" stop-color="#c1743f" />
      <stop offset="0.5" stop-color="#a95d2f" />
      <stop offset="1" stop-color="#6f3b1e" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#lift-ground)" />

  <g fill="none" stroke-width="104" stroke-linejoin="miter" stroke-miterlimit="24">
    <path
      d="M 852 404
         C 848 272 738 194 596 204
         C 540 208 528 262 476 258
         C 424 254 416 208 358 214
         C 300 220 296 268 244 252
         C 190 288 168 348 172 408
         C 176 504 248 574 358 600
         L 218 904
         L 540 614
         C 728 598 854 516 852 404 Z"
      transform="translate(26 30)" stroke="#6f3b1e" opacity="0.15"
    />
    <path
      d="M 852 404
         C 848 272 738 194 596 204
         C 540 208 528 262 476 258
         C 424 254 416 208 358 214
         C 300 220 296 268 244 252
         C 190 288 168 348 172 408
         C 176 504 248 574 358 600
         L 218 904
         L 540 614
         C 728 598 854 516 852 404 Z"
      stroke="url(#lift-line)"
    />
  </g>
</svg>
