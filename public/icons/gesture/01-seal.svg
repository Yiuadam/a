<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Gesture 01, Seal</title>
  <!--
    The closed reading, tightened until it behaves like a seal.

    One ring, uniform weight, four events spaced around it:
      an angular sawtooth along the top  — listening
      a dead-straight run down the right — reading
      a long spike at the foot           — writing
      a balloon out to the left          — speaking

    The parent mark spread its four behaviours evenly, which is exactly why it
    turned to mush small: nothing was allowed to be the loudest thing. Here the
    ring is lopsided on purpose — the left swings well past the nominal radius,
    the right is flattened to a ruler — so the silhouette carries it once the
    detail has gone.

    Two matched scallops over a central dip is a heart, which is what the first
    two passes of this drawing were. The crests are now three, unequal, angular
    rather than round, and the ring is wider than it is tall.
  -->
  <defs>
    <radialGradient id="seal-ground" cx="0.32" cy="0.26" r="0.92">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="1" stop-color="#e6d5bd" />
    </radialGradient>
    <linearGradient id="seal-line" gradientUnits="userSpaceOnUse"
      x1="120" y1="160" x2="880" y2="900">
      <stop offset="0" stop-color="#c1743f" />
      <stop offset="0.5" stop-color="#a95d2f" />
      <stop offset="1" stop-color="#6f3b1e" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#seal-ground)" />

  <g fill="none" stroke-width="118" stroke-linejoin="miter" stroke-miterlimit="20">
    <path
      d="M 196 372
         L 292 250
         L 356 344
         L 458 244
         L 528 330
         L 636 258
         L 758 330
         L 782 618
         L 892 900
         L 452 786
         C 268 792 146 700 152 552
         C 156 452 168 396 196 372 Z"
      transform="translate(26 30)" stroke="#6f3b1e" opacity="0.15"
    />
    <path
      d="M 196 372
         L 292 250
         L 356 344
         L 458 244
         L 528 330
         L 636 258
         L 758 330
         L 782 618
         L 892 900
         L 452 786
         C 268 792 146 700 152 552
         C 156 452 168 396 196 372 Z"
      stroke="url(#seal-line)"
    />
  </g>
</svg>
