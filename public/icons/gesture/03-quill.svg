         C 488 208 458 264 452 326
         C 468 250 512 196 578 190
         C 658 182 722 224 732 288
         C 742 352 686 384 600 424
         C 476 452 344 512 268 596
         C 212 660 196 804 172 928 Z"
      fill="#5d3f14" opacity="0.15" transform="translate(26 30)"
    />
    <path
      d="M 172 928
         C 226 828 262 762 330 700
         C 412 626 494 580 584 530
         C 686 474 756 446 784 394
