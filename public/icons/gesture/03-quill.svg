<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Gesture 03, Quill</title>
  <!--
    The most abstract of the set, and the least willing to explain itself.

    Nothing here is a picture of anything. One ribbon leaves the bottom-left as
    a hairline, gathers weight as it climbs, reaches its heaviest where the line
    is straightest, then curls over at the top and thins away to a point aimed
    back down at where it came from.

    The four behaviours are meant to be felt rather than counted: the tremor in
    the lower edge, the flat middle, the swell, and the bay the curl closes
    around. If the eye reads it as a single confident pen movement and nothing
    else, that is the mark working, not the mark failing.

    The shaft is deliberately fat for something this abstract. A thinner one
    was more elegant at full size and simply evaporated at a thirty-second of it.
  -->
  <defs>
    <radialGradient id="quill-ground" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="1" stop-color="#e2cdb0" />
    </radialGradient>
    <linearGradient id="quill-body" gradientUnits="userSpaceOnUse"
      x1="170" y1="930" x2="800" y2="150">
      <stop offset="0" stop-color="#5c2f16" />
      <stop offset="0.45" stop-color="#8b4a26" />
      <stop offset="1" stop-color="#c1743f" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#quill-ground)" />

  <g>
    <path
      d="M 172 928
         C 226 828 262 762 330 700
         C 412 626 494 580 584 530
         C 686 474 756 446 784 394
         C 824 326 816 242 766 194
