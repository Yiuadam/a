<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Gesture 03, Quill</title>
  <!--
    The most abstract of the set, and the least willing to explain itself.

    Nothing here is a picture of anything. One ribbon leaves the bottom-left as
    a hairline, gathers weight as it climbs, reaches its heaviest where the line
    is straightest, then curls over at the top and thins away to a point aimed
    back down at where it came from.

    The four behaviours are meant to be felt rather than counted: the tremor in
    the lower edge, the flat middle, the swell, the cupped bay under the curl.
    If the eye reads it as a single confident pen movement and nothing else,
    that is the mark working, not the mark failing.
  -->
  <defs>
    <radialGradient id="quill-ground" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="1" stop-color="#e7d6c0" />
    </radialGradient>
    <linearGradient id="quill-body" x1="0.1" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#6f3b1e" />
      <stop offset="0.45" stop-color="#a95d2f" />
      <stop offset="1" stop-color="#d08a5b" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#quill-ground)" />

  <g>
    <path
      d="M 186 918
         C 236 826 268 772 322 716
         C 400 636 470 588 556 540
         C 660 482 736 452 766 402
         C 804 340 800 262 758 216
         C 712 166 630 152 566 186
         C 512 214 486 260 480 314
         C 492 258 526 220 578 210
         C 646 196 706 226 720 278
         C 734 332 704 372 640 404
         C 540 454 428 512 358 578
         C 288 644 232 782 186 918 Z"
      fill="#5d3f14"
      opacity="0.14"
      transform="translate(26 30)"
    />
    <path
      d="M 186 918
         C 236 826 268 772 322 716
         C 400 636 470 588 556 540
         C 660 482 736 452 766 402
         C 804 340 800 262 758 216
         C 712 166 630 152 566 186
