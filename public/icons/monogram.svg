<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Monogram</title>
  <!--
    Direction 4: a letterform, but drawn rather than set. The stem is flat-sided
    and the two bowls are deliberately unequal — small above, heavy below — so
    the letter sits down on its baseline the way a drawn B does and a font's B
    does not. The fill lightens from clay at the foot to honey at the shoulder,
    which is the only thing in the mark that says "up".

    The counters are cut wider than the letter really wants at 1024, because at
    32px they are the first thing to close up and a B with filled counters is
    a black blob.
  -->
  <defs>
    <linearGradient id="mono-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdfaf6" />
      <stop offset="1" stop-color="#f0e5d7" />
    </linearGradient>
    <linearGradient id="mono-ink" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#8b4a26" />
      <stop offset="0.5" stop-color="#b76a34" />
      <stop offset="1" stop-color="#dda054" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#mono-ground)" />

  <path
    transform="translate(20 0)"
    fill="url(#mono-ink)"
    fill-rule="evenodd"
    d="M 288 224 H 508 A 131 131 0 0 1 508 486 H 540 A 157 157 0 0 1 540 800 H 288 Z
       M 408 316 H 512 A 39 39 0 0 1 512 394 H 408 Z
       M 408 492 H 502 A 107 107 0 0 1 502 706 H 408 Z"
  />
</svg>
