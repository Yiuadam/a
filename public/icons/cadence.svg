<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>BandUp icon — Cadence</title>
  <!--
    Direction 2: speech and listening — the two halves of the test that happen
    out loud. A speech bubble carrying three waveform strokes, the middle one
    tallest, so it reads as a phrase with a stress on it rather than as a
    generic equaliser.
  -->
  <defs>
    <linearGradient id="cadence-ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2a221b" />
      <stop offset="1" stop-color="#191410" />
    </linearGradient>
    <linearGradient id="cadence-wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a95d2f" />
      <stop offset="0.5" stop-color="#c1743f" />
      <stop offset="1" stop-color="#e5b25c" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#cadence-ground)" />

  <!--
    Bubble and tail share a fill and overlap, so the seam between them never
    shows. The tail points down-left, the direction a reader's eye leaves from.
  -->
  <g fill="#f7efe3">
    <path
      d="M 306 690 L 262 878 L 452 700 Z"
      stroke="#f7efe3"
      stroke-width="28"
      stroke-linejoin="round"
    />
    <rect x="176" y="212" width="672" height="512" rx="148" />
  </g>

  <!--
    Three strokes, fat rather than fine. A finer waveform looked better at 1024
    and disintegrated below 60px; at this weight each stroke is still ~3.8px on
    a 32px icon, which is the least that survives.
  -->
  <g fill="url(#cadence-wave)">
    <rect x="288" y="383" width="120" height="170" rx="60" />
    <rect x="452" y="318" width="120" height="300" rx="60" />
    <rect x="616" y="358" width="120" height="220" rx="60" />
  </g>
</svg>
