name: Preview a pull request

# ---------------------------------------------------------------------------
# Every change gets a URL of its own before it gets near production.
#
# The owner has real users now. Until then the agreement was to merge straight
# to `main` and let it go live, which was the right trade when the only person
# who could be inconvenienced by a bad deploy was the person who asked for it.
# That stopped being true, so this exists: a pull request is uploaded as its own
# Worker version, which Cloudflare serves on a preview URL and which is *not*
# what bandup.life points at.
#
# `versions upload` rather than `deploy`. The two are easy to confuse and the
# difference is the whole point of this file: `deploy` makes a version live,
# `versions upload` only publishes it and hands back a preview URL. Nothing here
# may ever call the first one.
#
# A version carries the secrets that existed when it was uploaded, so a preview
# reads the same real configuration production does — the real Supabase, the
# real Stripe. That is what makes it worth looking at, and what makes it worth
# remembering before running anything destructive against it.
#
# "The Worker's, not the version's" is what this said, and it is wrong in a way
# that cost an afternoon. Wrangler proves it twice: `wrangler versions secret
# put` answers "created version <id> with secret <name>", and plain `secret put`
# refuses outright while the latest version is undeployed, "to prevent
# accidental deployment when using Worker versions and secrets together".
# Neither makes sense unless a version holds its own snapshot.
#
# What follows from that is the part somebody needs at the time: a secret added
# *after* a preview was uploaded is not in that preview. Push again to get one
# that has it.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload a preview version
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork == false }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials — skipping the preview. See DEPLOY.md."
          fi

      - name: Build the Worker
        if: steps.creds.outputs.ready == 'true'
        run: npm run cf:build

      # Uploads without promoting. The URL is printed and captured for the
      # comment below; it is the only thing this job produces.
      #
      # --preview-alias pins the URL to the pull request number instead of a
      # fresh random hash per version: every push to this PR re-uploads under
      # the same alias, so the link posted below never changes and the owner
      # doesn't have to go find a new one after every commit.
      - name: Upload the preview version
        id: upload
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee /tmp/upload.log
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            if [ -n "$url" ]; then echo "$url"; else echo "Uploaded — see the log for the URL."; fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # In a comment, because a step summary is three clicks from the pull
      # request and the point of a preview is that it is easy to open.
      - name: Say where it is
        if: steps.creds.outputs.ready == 'true' && steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.upload.outputs.url) }};
            const body = [
              '**Preview:** ' + url,
              '',
              'This is this pull request, on its own version. `bandup.life` is unchanged.',
              '',
              'It runs against the *real* Supabase and the real Stripe configuration —',
              'a version carries the secrets that existed when it was uploaded — so anything',
              'you do here happens to real data. A secret added *after* this preview was',
              'uploaded is not in it; push again to get one that has it.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body?.startsWith('**Preview:**'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
