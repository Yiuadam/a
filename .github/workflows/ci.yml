name: CI

on:
  # A branch with an open pull request would otherwise be checked twice per
  # push, so pushes are only checked directly on the default branch.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck and build
        run: npm run build

      # Unit tests for the pieces whose correctness cannot be seen by reading
      # them — question numbering, answer marking, band arithmetic.
      - name: Unit tests
        run: npm test

      # The exam content is the product: a wrong answer key is a real defect,
      # so the answer keys are checked the same way the app scores them.
      - name: Validate exam content
        run: node scripts/validate-content.mjs

      # The placement engine is statistical, so it cannot be checked by reading
      # it. Simulated candidates of known ability catch a change that quietly
      # makes placement less accurate.
      - name: Check placement accuracy
        run: node scripts/simulate-placement.mjs

      # The iOS bundle is a different build target and can break on its own.
      - name: Build the iOS bundle
        run: npm run build:mobile
        env:
          NEXT_PUBLIC_API_BASE: https://example.invalid

      # So is the Cloudflare Worker, and it is stricter than the other two:
      # OpenNext refuses Node middleware, and Next 16 will not let a proxy.ts
      # run anywhere else. A change that reintroduces one passes every check
      # above and breaks deployment — which is exactly how it happened once,
      # in the pull request that added proxy.ts.
      - name: Build the Cloudflare Worker
        run: npm run cf:build

      # Building the Worker is not the same as checking what it sends. The app
      # once went live as unstyled HTML with every check above green: a page
      # was cacheable for a year, the stylesheet is fingerprinted and replaced
      # on every deploy, so a cached page asked for a hash that no longer
      # existed and got a 404. Every artifact was correct and the wreck
      # happened between two of them. This runs the built Worker and reads the
      # headers it actually sends.
      - name: Check how pages are delivered
        run: node scripts/check-delivery.mjs
