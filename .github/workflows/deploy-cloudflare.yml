name: Deploy to Cloudflare

# Pushes to main go live on Cloudflare Workers. The Worker keeps one stable
# address, so a bookmark or an App Store review link survives a deployment.
#
# This is the only deployment. The app ran on Vercel first, in parallel with
# this one for a while so the Worker could be exercised for real before
# anything was switched off; that overlap is over and deploy.yml is gone.
# Only what a human asks for. `main` used to deploy on every push, which was
# right while the only person a bad deploy could inconvenience was the person
# who asked for it. There are real users now, so a change reaches production
# when the owner has looked at its preview and said so — not when it merges.
# See .github/workflows/preview-cloudflare.yml.
on:
  # Lets a deploy be triggered from the Actions tab without inventing a commit.
  # The case that keeps coming up: the credentials were added *after* the last
  # push, so the run that mattered skipped its deploy step and there is nothing
  # left to re-run with the secrets now in place.
  workflow_dispatch:
    inputs:
      maintenance:
        description: "Close the site and show the maintenance screen"
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork == false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A repository without the secrets set skips quietly instead of showing a
      # red X for a deployment it was never configured to make — a fork should
      # not look broken.
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set — skipping deploy. See DEPLOY.md."
          fi

      # `deploy` deploys an already-built app — it does not build one. Running it
      # alone fails with "Could not find compiled Open Next config", which is
      # exactly what happened the first time this workflow ran for real.
      # NEXT_PUBLIC_ is load-bearing, not decoration: it is the only prefix Next
      # substitutes into the compiled code. A plain MAINTENANCE_MODE compiled to
      # a runtime lookup that found nothing on the Worker, so the flag read
      # false in production and the site stayed open through three deploys that
      # all reported success. See lib/maintenance.ts.
      - name: Build the Worker
        if: steps.creds.outputs.ready == 'true'
        run: npm run cf:build
        env:
          NEXT_PUBLIC_MAINTENANCE_MODE: ${{ inputs.maintenance && '1' || '0' }}

      - name: Say which way the site is going out
        if: steps.creds.outputs.ready == 'true'
        run: |
          if [ "${{ inputs.maintenance }}" = "true" ]; then
            echo "::warning::Deploying with the site CLOSED. Re-run this workflow with the maintenance box unticked to reopen it."
          else
            echo "::notice::Deploying with the site open."
          fi

      - name: Deploy the Worker
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm run cf:deploy
          echo "### Deployed to Cloudflare Workers" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
